repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.59.1
    hooks:
      - id: golangci-lint
        args: [--fix]
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
  - repo: local
    hooks:
      - id: ruff
        name: ruff (python)
        entry: ruff check prototype/agent-worker
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier (ts/tsx)
        entry: npx prettier --check "prototype/dashboard/src/**/*.{ts,tsx}"
        language: system
        pass_filenames: false
