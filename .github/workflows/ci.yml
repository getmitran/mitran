name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -v -count=1

  python-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/agent-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: pip install pytest
      - run: pytest tests/ -v || true

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: prototype/server
          args: --timeout=5m
