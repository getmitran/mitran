name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: prototype/server/go.sum
      - uses: golangci/golangci-lint-action@v4
        with:
          working-directory: prototype/server

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/agent-worker/requirements.txt
      - run: pip install ruff black
      - run: ruff check prototype/agent-worker
      - run: black --check prototype/agent-worker

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: prototype/dashboard/package-lock.json
      - run: npm ci
        working-directory: prototype/dashboard
      - run: npx eslint .
        working-directory: prototype/dashboard
      - run: npx prettier --check .
        working-directory: prototype/dashboard

  test-go:
    needs: lint-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: prototype/server/go.sum
      - run: go test ./...
        working-directory: prototype/server

  test-python:
    needs: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/agent-worker/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: prototype/agent-worker
      - run: pip install pytest
      - run: pytest
        working-directory: prototype/agent-worker

  build-go:
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: prototype/server/go.sum
      - run: go build ./...
        working-directory: prototype/server

  build-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: prototype/dashboard/package-lock.json
      - run: npm ci
        working-directory: prototype/dashboard
      - run: npm run build
        working-directory: prototype/dashboard

  security-scan:
    needs: [build-go, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan server Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: prototype/server/Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan agent-worker Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: prototype/agent-worker/Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"
