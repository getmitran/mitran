name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: prototype/server/go.sum
      - uses: golangci/golangci-lint-action@v4
        with:
          working-directory: prototype/server

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/agent-worker/requirements.txt
      - run: pip install ruff black
      - run: ruff check prototype/agent-worker
      - run: black --check prototype/agent-worker

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: prototype/dashboard/package-lock.json
      - run: npm ci
        working-directory: prototype/dashboard
      - run: npx eslint .
        working-directory: prototype/dashboard
      - run: npx prettier --check .
        working-directory: prototype/dashboard

  test-go:
    needs: lint-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: prototype/server/go.sum
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./auth/ ./session/ ./queue/ ./audit/ ./handlers/ ./middleware/ ./apierr/
        working-directory: prototype/server
      - name: Enforce minimum coverage (60%)
        working-directory: prototype/server
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 60" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below minimum 60%"
            exit 1
          fi

  test-python:
    needs: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/agent-worker/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: prototype/agent-worker
      - run: pip install pytest
      - run: pytest
        working-directory: prototype/agent-worker

  build-go:
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: prototype/server/go.sum
      - run: go build ./...
        working-directory: prototype/server

  build-frontend:
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: prototype/dashboard/package-lock.json
      - run: npm ci
        working-directory: prototype/dashboard
      - run: npm run build
        working-directory: prototype/dashboard
      - name: Run tests with coverage
        working-directory: prototype/dashboard
        run: npx vitest run --coverage
      - name: Enforce minimum frontend coverage (50%)
        working-directory: prototype/dashboard
        run: node -e "const c=require('./coverage/coverage-summary.json');const p=c.total.lines.pct;if(p<50){console.error('Frontend coverage '+p+'% < 50% minimum');process.exit(1)}"

  security-scan:
    needs: [build-go, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan server Dockerfile
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: config
          scan-ref: prototype/server/Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan agent-worker Dockerfile
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: config
          scan-ref: prototype/agent-worker/Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"
