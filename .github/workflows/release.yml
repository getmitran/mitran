name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: prototype/server/go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd prototype/server
          go build -ldflags="-s -w" -o ../../mitran-engine-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: mitran-engine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mitran-engine-${{ matrix.goos }}-${{ matrix.goarch }}

  docker:
    runs-on: ubuntu-latest
    needs: build-binaries
    strategy:
      matrix:
        include:
          - image: mitran-engine
            context: prototype/server
          - image: mitran-worker
            context: prototype/agent-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/getmitran/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/getmitran/${{ matrix.image }}:latest

  release:
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: mitran-engine-*
          generate_release_notes: true
