syntax = "proto3";
package mitran.v1;
option go_package = "github.com/getmitran/mitran/proto/v1";

service AgentWorker {
  rpc ExecuteTask(TaskRequest) returns (stream TaskProgress);
  rpc HealthCheck(Empty) returns (HealthResponse);
  rpc Shutdown(Empty) returns (Empty);
}

service ToolService {
  rpc CallTool(ToolCallRequest) returns (ToolCallResponse);
  rpc ListTools(Empty) returns (ToolListResponse);
  rpc ApprovalRequired(ApprovalRequest) returns (ApprovalResponse);
}

message Empty {}

message TaskRequest {
  string task_id = 1;
  string title = 2;
  string description = 3;
  string agent_type = 4;
  string project_id = 5;
  string workspace_path = 6;
  map<string, string> context = 7;
  repeated string skill_paths = 8;
}

message TaskProgress {
  string task_id = 1;
  ProgressType type = 2;
  string message = 3;
  int32 percent = 4;
  repeated FileChange files = 5;
  string summary = 6;
  repeated string questions = 7;
}

enum ProgressType {
  PROGRESS = 0;
  TOOL_CALL = 1;
  CHECKPOINT = 2;
  COMPLETE = 3;
  FAILED = 4;
}

message FileChange {
  string path = 1;
  string action = 2;
  string content = 3;
  string diff = 4;
}

message ToolCallRequest {
  string tool_name = 1;
  string server_name = 2;
  map<string, string> arguments = 3;
  string agent_id = 4;
  string task_id = 5;
}

message ToolCallResponse {
  bool success = 1;
  string result = 2;
  string error = 3;
}

message ApprovalRequest {
  string tool_name = 1;
  string server_name = 2;
  map<string, string> arguments = 3;
  string agent_id = 4;
  string approval_mode = 5;
}

message ApprovalResponse {
  bool approved = 1;
  string reason = 2;
}

message ToolListResponse {
  repeated ToolInfo tools = 1;
}

message ToolInfo {
  string name = 1;
  string server = 2;
  string description = 3;
  string input_schema = 4;
}

message HealthResponse {
  string status = 1;
  string agent_id = 2;
  int64 uptime_seconds = 3;
}
