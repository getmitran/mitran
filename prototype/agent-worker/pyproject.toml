[project]
name = "mitran-agent-worker"
version = "0.1.0"
description = "Mitran Agent Worker - executes tasks via AWS Bedrock Claude"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "flask>=3.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
