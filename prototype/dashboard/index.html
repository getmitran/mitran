<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mitran Dashboard</title>
    <meta name="description" content="Mitran AI Agent Orchestration Dashboard">
  </head>
  <body class="antialiased" style="background:var(--bg);color:var(--text)">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Restore saved theme preference
      const saved = localStorage.getItem('mitran-theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      else if (window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.setAttribute('data-theme', 'light');
    </script>
  </body>
</html>
