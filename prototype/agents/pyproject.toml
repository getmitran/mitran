[project]
name = "mitran-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic", "openai", "pydantic"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["mitran_sdk", "agents"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
